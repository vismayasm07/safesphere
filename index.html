<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeSphere — The Safest Map</title>
<meta name="description" content="SafeSphere is a predictive safety-navigation platform that guides you through safe corridors in real time — not just reactive emergency calls. Live DSI routing, guardian network, and city safety analytics." />
<meta name="theme-color" content="#188a5a" />
<meta name="author" content="SafeSphere" />
<link rel="icon" type="image/jpeg" href="logo.jpeg" />
<link rel="apple-touch-icon" href="logo.jpeg" />
<meta property="og:type" content="website" />
<meta property="og:title" content="SafeSphere — The Safest Map" />
<meta property="og:description" content="Predictive safety navigation that routes you through the safest streets in real time. Live DSI, guardian network, and city safety analytics." />
<meta property="og:image" content="logo.jpeg" />
<meta property="og:site_name" content="SafeSphere" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="SafeSphere — The Safest Map" />
<meta name="twitter:description" content="Predictive safety navigation that routes you through the safest streets in real time." />
<meta name="twitter:image" content="logo.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
  --bg:#eef5ee; --bg-2:#f6faf6;
  --card:#ffffff; --stroke:#e3ede4; --stroke-2:#d3e2d4;
  --ink:#123227; --ink-2:#2f4b40; --muted:#5d7568; --muted-2:#93a89b;
  --green:#188a5a; --green-2:#0f6e46; --green-50:#e8f6ee; --green-100:#cdebd8;
  --coral:#f4643f; --coral-2:#e04a26; --coral-50:#fdece6; --coral-100:#fbd7cb;
  --yellow:#f7c948; --yellow-2:#eab308; --yellow-50:#fef7e0;
  --sky:#2f80d6; --sky-50:#e7f1fb;
  --rose:#e5484d; --rose-50:#fdeaea;
  --r:20px; --r-sm:14px;
  --sh-soft:0 1px 2px rgba(18,50,39,.05), 0 10px 26px -14px rgba(18,50,39,.20);
  --sh-lift:0 2px 8px rgba(18,50,39,.06), 0 22px 46px -18px rgba(18,50,39,.30);
  --sh-glow:0 10px 26px -8px rgba(24,138,90,.45);
  --sh-coral:0 10px 26px -8px rgba(244,100,63,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(880px 520px at 100% -8%, rgba(24,138,90,.10), transparent 60%),
    radial-gradient(760px 500px at -6% 4%, rgba(247,201,72,.14), transparent 60%),
    radial-gradient(700px 520px at 60% 120%, rgba(244,100,63,.07), transparent 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfe0d3;border-radius:10px;border:2px solid transparent;background-clip:padding-box}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.app{display:grid;grid-template-columns:274px 1fr;height:100vh}

/* ---------------- SIDEBAR ---------------- */
.sidebar{display:flex;flex-direction:column;gap:18px;padding:20px 15px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.62));backdrop-filter:blur(16px);border-right:1px solid var(--stroke)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px}
.brand-emblem{width:48px;height:48px;border-radius:15px;flex:none;overflow:hidden;background:#fff;box-shadow:var(--sh-soft);border:1px solid var(--stroke);position:relative;animation:floaty 6s ease-in-out infinite}
.brand-emblem::before{content:"";position:absolute;inset:0;background-image:url('logo.jpeg');background-size:210%;background-position:50% 26%;background-repeat:no-repeat}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.brand-name{font-weight:900;font-size:18px;letter-spacing:-.02em;line-height:1;color:var(--green-2)}
.brand-sub{font-size:11px;color:var(--coral);font-weight:700;margin-top:3px;font-style:italic}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted-2);font-weight:800;margin:12px 8px 4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:13px;background:none;border:none;color:var(--muted);text-align:left;width:100%;transition:.2s}
.nav-item:hover{background:#eaf3ec;color:var(--ink-2)}
.nav-item.active{background:var(--green-50);color:var(--green-2);box-shadow:var(--sh-soft)}
.nav-ico{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:#eef4ef;color:var(--muted);transition:.2s}
.nav-item.active .nav-ico{background:var(--green);color:#fff;box-shadow:var(--sh-glow)}
.nav-ico svg{width:18px;height:18px}
.nav-txt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nav-title{font-size:13px;font-weight:700}
.nav-desc{font-size:10.5px;color:var(--muted-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--coral-50);color:var(--coral-2)}
.sos-side{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;border-radius:15px;border:none;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--coral),var(--coral-2));box-shadow:var(--sh-coral);transition:.2s}
.sos-side:hover{transform:translateY(-1px)}
.sos-side svg{width:18px;height:18px}
.sos-side .rng{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:sospulse 1.6s infinite}
@keyframes sospulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ---------------- MAIN ---------------- */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 24px;background:rgba(246,250,246,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke);flex:none}
.tb-left{display:flex;align-items:center;gap:12px}
.tb-mobile-logo{display:none}
.page-title{font-size:19px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.page-title svg{width:20px;height:20px;color:var(--green)}
.page-sub{font-size:12px;color:var(--muted-2);margin-top:2px}
.tb-right{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:9px 12px;width:250px;box-shadow:var(--sh-soft)}
.search svg{width:16px;height:16px;color:var(--muted-2)}
.search input{border:none;outline:none;background:none;font-size:13px;width:100%;color:var(--ink-2)}
.search kbd{font-size:10px;color:var(--muted-2);border:1px solid var(--stroke-2);border-radius:6px;padding:2px 6px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--stroke);box-shadow:var(--sh-soft);display:grid;place-items:center;color:var(--muted);transition:.2s}
.icon-btn:hover{color:var(--green);transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:9px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(140deg,var(--green),var(--yellow-2));box-shadow:var(--sh-soft)}
.view-tabs{display:none;gap:8px;padding:12px 16px 0;overflow-x:auto}
.view-tab{white-space:nowrap;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:11px;border:1px solid var(--stroke-2);background:#fff;color:var(--muted)}
.view-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.content{flex:1;overflow-y:auto;padding:22px 24px 34px}
.view{display:none}
.view.active{display:block;animation:vin .5s cubic-bezier(.22,1,.36,1)}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------------- CARDS / GRID ---------------- */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:var(--sh-soft);transition:transform .3s,box-shadow .3s}
.card.hoverable:hover{transform:translateY(-3px);box-shadow:var(--sh-lift)}
.pad{padding:20px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g12{grid-template-columns:repeat(12,1fr)}
.col-8{grid-column:span 8}.col-7{grid-column:span 7}.col-6{grid-column:span 6}.col-5{grid-column:span 5}.col-4{grid-column:span 4}.col-3{grid-column:span 3}
.mt{margin-top:18px}
.sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-title{font-size:15px;font-weight:800;letter-spacing:-.01em}
.sec-sub{font-size:12px;color:var(--muted-2);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.pill .d{width:7px;height:7px;border-radius:50%}
.pill-green{background:var(--green-50);color:var(--green-2)}
.pill-coral{background:var(--coral-50);color:var(--coral-2)}
.pill-yellow{background:var(--yellow-50);color:#a97e07}
.pill-sky{background:var(--sky-50);color:#1d5fa8}
.pill-rose{background:var(--rose-50);color:#b4282c}
.pill-slate{background:#eef4ef;color:var(--muted)}

/* KPI */
.kpi{padding:19px}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between}
.kpi-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.kpi-ico svg{width:20px;height:20px}
.tint-green{background:var(--green-50);color:var(--green)}
.tint-coral{background:var(--coral-50);color:var(--coral)}
.tint-yellow{background:var(--yellow-50);color:var(--yellow-2)}
.tint-sky{background:var(--sky-50);color:var(--sky)}
.kpi-label{font-size:13px;color:var(--muted);font-weight:600;margin-top:15px}
.kpi-val{font-size:26px;font-weight:900;letter-spacing:-.03em;margin-top:4px;display:flex;align-items:baseline;gap:8px}
.kpi-val small{font-size:12.5px;font-weight:700}
.up{color:var(--green)}.down{color:var(--coral-2)}

/* map */
.map-card{padding:10px;position:relative}
.route-bar{display:flex;align-items:center;gap:10px;padding:6px 6px 12px}
.city-sel{flex:none;background:#123227;color:#fff;border:1px solid var(--stroke);border-radius:12px;padding:11px 13px;font-size:13px;font-weight:800;font-family:inherit;outline:none;cursor:pointer;box-shadow:var(--sh-soft)}
.city-sel:hover{filter:brightness(1.1)}
.field{flex:1;display:flex;align-items:center;gap:9px;background:#f2f8f3;border:1px solid var(--stroke);border-radius:12px;padding:11px 13px}
.field .d{width:10px;height:10px;border-radius:50%;flex:none}
.field input{border:none;background:none;outline:none;font-size:13.5px;width:100%;color:var(--ink-2)}
.go-btn{background:var(--green);color:#fff;border:none;font-weight:800;font-size:14px;padding:11px 20px;border-radius:12px;box-shadow:var(--sh-glow);display:flex;align-items:center;gap:8px;transition:.2s}
.go-btn:hover{background:var(--green-2);transform:translateY(-1px)}
.loc-btn{flex:none;background:#eef4ff;color:#2f80d6;border:1px solid var(--stroke);border-radius:12px;padding:11px;display:flex;align-items:center;cursor:pointer;transition:.2s}
.loc-btn:hover{background:#2f80d6;color:#fff;transform:translateY(-1px)}
.loc-btn svg{width:16px;height:16px}
.go-btn svg{width:16px;height:16px}
#map{height:430px;width:100%;border-radius:14px;overflow:hidden;background:#e4eee6;z-index:0}
.nav-status{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 12px;margin:0 4px 10px;background:var(--bg-2);border:1px solid var(--stroke);border-radius:11px}
.nav-status b{color:var(--ink-2);font-weight:800}
.leaflet-container{font-family:'Inter',sans-serif;background:#e4eee6}
.map-legend{position:absolute;left:22px;bottom:22px;z-index:500;display:flex;flex-wrap:wrap;gap:12px;padding:9px 13px;border-radius:12px;font-size:11px;color:var(--ink-2);background:rgba(255,255,255,.92);box-shadow:var(--sh-soft);border:1px solid var(--stroke)}
.map-legend span{display:flex;align-items:center;gap:6px}
.map-legend i{width:9px;height:9px;border-radius:50%}

/* DSI time slider */
.dsi-time{display:flex;align-items:center;gap:12px;margin-top:6px}
.dsi-time input[type=range]{flex:1;-webkit-appearance:none;height:7px;border-radius:7px;background:linear-gradient(90deg,#1a3a2b,#2f80d6,#f7c948,#f4643f,#1a3a2b);outline:none}
.dsi-time input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--green);box-shadow:var(--sh-soft);cursor:pointer}
.dsi-clock{font-size:15px;font-weight:800;width:78px;text-align:center}
.dsi-phase{font-size:11px;color:var(--muted-2);font-weight:600}

/* gauge/score */
.score-row{display:flex;align-items:center;gap:18px}
.score-badges{display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--ink-2)}
.score-badges .b{display:flex;align-items:center;gap:9px}
.score-badges .bi{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex:none}
.score-badges .bi svg{width:14px;height:14px}

/* route options */
.route-opt{width:100%;text-align:left;border:1.5px solid var(--stroke);background:#fff;border-radius:15px;padding:13px;transition:.2s;display:flex;align-items:center;justify-content:space-between}
.route-opt:hover{border-color:var(--stroke-2)}
.route-opt.sel{border-color:var(--green);background:var(--green-50)}
.ro-l{display:flex;align-items:center;gap:11px}
.ro-ico{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;flex:none}
.ro-ico svg{width:18px;height:18px}
.ro-name{font-size:13.5px;font-weight:800}
.ro-meta{font-size:11px;color:var(--muted-2)}
.ro-time{font-size:13.5px;font-weight:800;text-align:right}
.btn-dark{width:100%;margin-top:14px;background:var(--ink);color:#fff;border:none;font-weight:800;font-size:14px;padding:13px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:9px;transition:.2s}
.btn-dark:hover{background:#0c231b}
.btn-dark svg{width:17px;height:17px}
.progress{height:7px;border-radius:7px;background:#e9f1ea;overflow:hidden}
.progress > i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--green),#3fc27f)}

/* data layers toggles */
.layer-row{display:flex;flex-direction:column;gap:9px}
.layer-tog{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--stroke);border-radius:13px;background:#fbfdfb;transition:.2s}
.layer-tog:hover{border-color:var(--stroke-2)}
.lt-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.lt-ico svg{width:16px;height:16px}
.lt-name{font-size:13px;font-weight:700}
.lt-desc{font-size:11px;color:var(--muted-2)}
.switch{margin-left:auto;width:40px;height:23px;border-radius:20px;background:#d6e3d8;position:relative;transition:.2s;flex:none;border:none}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{left:19.5px}

/* charts */
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted-2);margin-top:8px}
.legend{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:9px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto}
.donut-wrap{display:flex;align-items:center;gap:20px}
.rank{display:flex;align-items:center;gap:11px;padding:8px 0}
.rank .n{font-size:12px;font-weight:800;color:var(--muted-2);width:16px}
.rank .nm{font-size:13px;font-weight:700;width:120px}
.rank .bar{flex:1;height:9px;border-radius:9px;background:#e9f1ea;overflow:hidden}
.rank .bar > i{display:block;height:100%;border-radius:9px}
.rank .sc{font-size:13px;font-weight:800;width:32px;text-align:right}
.rank .tr{font-size:11.5px;font-weight:700;width:32px;text-align:right}

/* SOS view */
.sos-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center}
.sos-btn-big{width:190px;height:190px;border-radius:50%;border:none;color:#fff;font-weight:900;font-size:30px;letter-spacing:.05em;background:radial-gradient(circle at 50% 35%,#ff7a57,var(--coral-2));box-shadow:0 20px 50px -12px rgba(224,74,38,.6),inset 0 2px 0 rgba(255,255,255,.3);position:relative;transition:.15s}
.sos-btn-big:active{transform:scale(.96)}
.sos-btn-big::before,.sos-btn-big::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(244,100,63,.5);animation:sosring 2.4s infinite}
.sos-btn-big::after{animation-delay:1.2s}
@keyframes sosring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.sos-sub{font-size:13px;color:var(--muted);margin-top:20px;max-width:280px}
.contact{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #eef4ef}
.contact:first-child{border-top:none}
.contact .cav{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.contact .cn{font-size:13.5px;font-weight:700}
.contact .cr{font-size:11.5px;color:var(--muted-2)}
.contact .cbtn{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke);background:#fff;display:grid;place-items:center;color:var(--green)}
.monitor{display:flex;gap:13px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--yellow-50);border:1px solid #f3e2a8}
.monitor .mi{width:40px;height:40px;border-radius:12px;background:var(--yellow);color:#7a5a06;display:grid;place-items:center;flex:none}
.monitor .mi svg{width:19px;height:19px}
.checkin-btns{display:flex;gap:10px;margin-top:12px}
.chk{flex:1;padding:11px;border-radius:12px;border:none;font-weight:800;font-size:13px}
.chk-ok{background:var(--green);color:#fff}
.chk-no{background:var(--coral);color:#fff}

/* community */
.report{display:flex;gap:12px;padding:13px;border-radius:14px;background:#fbfdfb;border:1px solid var(--stroke);margin-bottom:10px}
.report .ri{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center}
.report .ri svg{width:16px;height:16px}
.report .rt{font-size:13px;font-weight:700}
.report .rm{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.report .rv{margin-left:auto;text-align:right;white-space:nowrap}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;border:1.5px solid var(--stroke);background:#fff;color:var(--muted);transition:.2s}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.vibe-btn{width:46px;height:46px;border-radius:13px;border:1.5px solid var(--stroke);background:#fff;font-size:22px;transition:.2s}
.vibe-btn:hover{transform:translateY(-2px)}
.vibe-btn.sel{border-color:var(--green);background:var(--green-50)}
.textarea{width:100%;border:1px solid var(--stroke);border-radius:12px;padding:12px;font-size:13px;resize:none;outline:none;color:var(--ink-2);background:#fbfdfb}
.trust{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:12px;background:var(--green-50);font-size:12px;color:var(--green-2);font-weight:600}
.trust svg{width:16px;height:16px;flex:none}

/* havens */
.haven{display:flex;gap:12px;align-items:center;padding:13px;border-radius:15px;border:1px solid var(--stroke);background:#fff;transition:.2s}
.haven:hover{box-shadow:var(--sh-soft)}
.haven .hi{width:44px;height:44px;border-radius:13px;background:var(--green-50);color:var(--green);display:grid;place-items:center;flex:none;position:relative}
.haven .hi svg{width:20px;height:20px}
.hbadge{position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:var(--green);border:2px solid #fff;display:grid;place-items:center}
.hbadge svg{width:10px;height:10px;color:#fff}
.haven .hn{font-size:13.5px;font-weight:800}
.haven .hm{font-size:11.5px;color:var(--muted-2)}
.haven .hd{margin-left:auto;text-align:right}

/* b2b */
.field-copy{display:flex;align-items:center;gap:8px;background:#f2f8f3;border:1px solid var(--stroke);border-radius:12px;padding:11px 13px}
.field-copy code{font-size:12.5px;color:var(--ink-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field-copy button{background:none;border:none;color:var(--muted-2);display:grid;place-items:center}
.field-copy button:hover{color:var(--green)}
.field-copy svg{width:16px;height:16px}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.btn-ghost{width:100%;margin-top:14px;background:#fff;border:1.5px solid var(--stroke-2);color:var(--muted);font-weight:800;font-size:13.5px;padding:11px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}
.btn-ghost svg{width:16px;height:16px}
.code-block{background:#0f2a20;color:#e6f3ec;border-radius:15px;padding:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.65;overflow-x:auto;white-space:pre}
.code-block .k{color:#7ee0a8}.code-block .s{color:#f7c948}.code-block .c{color:#6f8c7e}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.mini{border:1px solid var(--stroke);border-radius:13px;padding:13px}
.mini .t{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted-2);font-weight:700}
.mini .t svg{width:14px;height:14px}
.mini .v{font-size:13.5px;font-weight:800;margin-top:5px}
.evt{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #eef4ef}
.evt:first-child{border-top:none}
.evt code{font-size:12.5px;font-weight:700;width:180px}
.evt .m{font-size:12.5px;color:var(--muted-2);flex:1}
.evt .tm{font-size:11px;color:var(--muted-2)}
.partner{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--stroke);border-radius:13px}
.partner .pl{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.spark{display:block}

/* overview feature cards */
.feat{display:flex;gap:13px;padding:16px;align-items:flex-start}
.feat .fi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.feat .fi svg{width:21px;height:21px}
.feat .ft{font-size:14px;font-weight:800}
.feat .fm{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:var(--sh-lift);opacity:0;pointer-events:none;transition:.35s;z-index:9999;display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:18px;height:18px;color:var(--yellow)}

@media(max-width:1100px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .tb-mobile-logo{display:block;width:38px;height:38px;border-radius:11px;overflow:hidden;background:#fff;border:1px solid var(--stroke);position:relative}
  .tb-mobile-logo::before{content:"";position:absolute;inset:0;background-image:url('logo.jpeg');background-size:210%;background-position:50% 26%}
  .view-tabs{display:flex}
  .g4{grid-template-columns:1fr 1fr}
  .g2,.g3{grid-template-columns:1fr}
  .g12>[class*=col-]{grid-column:span 12}
  .search{display:none}
}

/* ===== DASHBOARD OVERVIEW (operational home) ===== */
.welcome{display:flex;align-items:center;gap:20px;padding:22px 24px;flex-wrap:wrap;background:
  radial-gradient(420px 200px at 100% 0,rgba(24,138,90,.07),transparent 60%),var(--card)}
.welcome .wl-l{flex:1;min-width:250px}
.welcome h2{font-size:22px;font-weight:900;letter-spacing:-.02em}
.welcome .sub{font-size:13px;color:var(--muted);margin-top:9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.welcome .wl-actions{display:flex;gap:10px;flex-wrap:wrap}
.qtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.qtile{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--stroke);border-radius:15px;cursor:pointer;transition:.25s;background:var(--card)}
.qtile:hover{border-color:var(--green-100);transform:translateY(-3px);box-shadow:var(--sh-lift)}
.qtile .qi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.qtile .qi svg{width:21px;height:21px}
.qtile h4{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.qtile p{font-size:11.5px;color:var(--muted-2);margin-top:3px}
.qtile .qa{margin-left:auto;color:var(--muted-2);display:flex}
.qtile .qa svg{width:16px;height:16px;transition:transform .2s}
.qtile:hover .qa svg{transform:translateX(3px);color:var(--green)}
.act{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #eef4ef}
.act:first-child{border-top:none;padding-top:2px}
.act .ai{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.act .ai svg{width:16px;height:16px}
.act .at{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.act .am{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.act .atm{margin-left:auto;font-size:10.5px;color:var(--muted-2);white-space:nowrap;font-weight:700}

/* ================= LANDING / HOME ================= */
.landing{height:100vh;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.landing.hidden{display:none}
.app.hidden{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 30px}
.lnav{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;padding:14px 30px;background:rgba(246,250,246,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--stroke)}
.lnav .lbrand{display:flex;align-items:center;gap:11px;cursor:pointer}
.lnav .lbrand .em{width:40px;height:40px;border-radius:12px;overflow:hidden;position:relative;background:#fff;border:1px solid var(--stroke);box-shadow:var(--sh-soft)}
.lnav .lbrand .em::before{content:"";position:absolute;inset:0;background-image:url('logo.jpeg');background-size:210%;background-position:50% 26%}
.lnav .lbrand b{font-size:17px;font-weight:900;letter-spacing:-.02em;color:var(--green-2)}
.lnav .lbrand span{display:block;font-size:10px;color:var(--coral);font-weight:700;font-style:italic;margin-top:1px}
.lnav-links{display:flex;gap:2px;margin-left:10px}
.lnav-links a{font-size:13.5px;font-weight:600;color:var(--muted);padding:8px 12px;border-radius:10px;text-decoration:none;transition:.2s}
.lnav-links a:hover{background:#eaf3ec;color:var(--ink-2)}
.lnav-cta{margin-left:auto;display:flex;gap:10px;align-items:center}
.lbtn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;padding:10px 16px;border-radius:12px;border:none;transition:.2s;text-decoration:none}
.lbtn svg{width:16px;height:16px}
.lbtn-primary{background:var(--green);color:#fff;box-shadow:var(--sh-glow)}
.lbtn-primary:hover{transform:translateY(-1px);background:var(--green-2)}
.lbtn-ghost{background:#fff;color:var(--ink-2);border:1px solid var(--stroke)}
.lbtn-ghost:hover{border-color:var(--stroke-2);transform:translateY(-1px)}
.lbtn-coral{background:linear-gradient(135deg,var(--coral),var(--coral-2));color:#fff;box-shadow:var(--sh-coral)}
.lbtn-coral:hover{transform:translateY(-1px)}
.lbtn-dark{background:var(--ink);color:#fff}
.lbtn-dark:hover{transform:translateY(-1px);background:#0b241b}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--green-2);background:var(--green-50);border:1px solid var(--green-100);padding:6px 13px;border-radius:20px}
.eyebrow .d{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-100)}
.sect{padding:66px 0}
.sect-tight{padding:42px 0}
.sect-head{text-align:center;max-width:640px;margin:0 auto 42px}
.sect-head .eyebrow{margin-bottom:16px}
.sect-head h2{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.12;color:var(--ink)}
.sect-head p{font-size:15px;color:var(--muted);margin-top:14px;line-height:1.6}
.k{color:var(--green)}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:70px 0 40px}
.hero h1{font-size:52px;line-height:1.05;font-weight:900;letter-spacing:-.035em;color:var(--ink);margin-top:22px}
.hero h1 em{font-style:normal;color:var(--green);position:relative}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:12px;background:var(--yellow);opacity:.45;border-radius:6px;z-index:-1}
.hero p.lead{font-size:16.5px;color:var(--muted);line-height:1.65;margin-top:22px;max-width:520px}
.hero-cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero-cta .lbtn{padding:13px 20px;font-size:14.5px}
.hero-stats{display:flex;gap:30px;margin-top:38px}
.hero-stats .hs b{font-size:26px;font-weight:900;letter-spacing:-.02em;color:var(--ink);display:block}
.hero-stats .hs span{font-size:12.5px;color:var(--muted-2);font-weight:600}
.hero-stats .sep{width:1px;background:var(--stroke-2)}

/* hero visual */
.hv{position:relative;height:430px}
.hv-map{position:absolute;inset:0;border-radius:26px;overflow:hidden;border:1px solid var(--stroke);box-shadow:var(--sh-lift);background:
  radial-gradient(420px 300px at 70% 15%,rgba(24,138,90,.10),transparent 60%),
  radial-gradient(360px 320px at 10% 90%,rgba(247,201,72,.16),transparent 60%),
  linear-gradient(160deg,#f2f8f3,#e7f1ea)}
.hv-map svg.route{position:absolute;inset:0;width:100%;height:100%}
.hv-grid{position:absolute;inset:0;background-image:linear-gradient(#dbe8de 1px,transparent 1px),linear-gradient(90deg,#dbe8de 1px,transparent 1px);background-size:46px 46px;opacity:.5}
.chip-float{position:absolute;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--stroke);border-radius:14px;padding:9px 12px;box-shadow:var(--sh-lift);font-size:12px;font-weight:700;color:var(--ink-2);animation:floaty 6s ease-in-out infinite}
.chip-float .ci{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.chip-float svg{width:15px;height:15px}
.hv-score{position:absolute;right:20px;bottom:20px;background:#fff;border:1px solid var(--stroke);border-radius:18px;padding:15px 17px;box-shadow:var(--sh-lift);text-align:center;min-width:150px}
.hv-score .lab{font-size:11px;font-weight:700;color:var(--muted-2)}
.hv-score .num{font-size:36px;font-weight:900;color:var(--green);letter-spacing:-.03em;line-height:1}
.hv-score .sub{font-size:11px;color:var(--muted);font-weight:600}

/* trust strip */
.trust-strip{border-top:1px solid var(--stroke);border-bottom:1px solid var(--stroke);background:var(--bg-2)}
.trust-strip .in{display:flex;align-items:center;justify-content:center;gap:12px 34px;flex-wrap:wrap;padding:22px 0}
.trust-strip .lbl2{font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:.04em;text-transform:uppercase}
.trust-strip .badge2{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--ink-2)}
.trust-strip .badge2 svg{width:17px;height:17px;color:var(--green)}

/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;position:relative}
.step{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:26px;box-shadow:var(--sh-soft);position:relative;transition:transform .3s,box-shadow .3s}
.step:hover{transform:translateY(-4px);box-shadow:var(--sh-lift)}
.step .snum{position:absolute;top:20px;right:22px;font-size:34px;font-weight:900;color:var(--stroke-2);letter-spacing:-.03em}
.step .sic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:16px}
.step .sic svg{width:24px;height:24px}
.step h3{font-size:17px;font-weight:900;letter-spacing:-.01em}
.step p{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:8px}

/* feature groups */
.fgroup{margin-bottom:40px}
.fgroup-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.fgroup-head .gi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.fgroup-head .gi svg{width:18px;height:18px}
.fgroup-head h3{font-size:19px;font-weight:900;letter-spacing:-.02em}
.fgroup-head .gl{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted-2)}
.fcards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.fcard{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:20px;box-shadow:var(--sh-soft);cursor:pointer;transition:transform .3s,box-shadow .3s,border-color .3s;display:flex;flex-direction:column}
.fcard:hover{transform:translateY(-4px);box-shadow:var(--sh-lift);border-color:var(--green-100)}
.fcard .fi2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px}
.fcard .fi2 svg{width:22px;height:22px}
.fcard h4{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.fcard p{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:7px;flex:1}
.fcard .open{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--green-2)}
.fcard .open svg{width:14px;height:14px;transition:transform .2s}
.fcard:hover .open svg{transform:translateX(3px)}

/* data layers band */
.band{background:linear-gradient(135deg,#0f6e46,#188a5a);border-radius:28px;padding:44px;color:#fff;position:relative;overflow:hidden}
.band .blob{position:absolute;border-radius:50%}
.dl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:8px}
.dl{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:22px;backdrop-filter:blur(4px)}
.dl .di{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.16);margin-bottom:14px}
.dl .di svg{width:22px;height:22px;color:#fff}
.dl h4{font-size:16px;font-weight:800}
.dl p{font-size:12.5px;color:rgba(255,255,255,.8);line-height:1.55;margin-top:7px}
.dl .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dl .tags span{font-size:11px;font-weight:700;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:20px}
.band-trust{display:flex;align-items:center;gap:12px;margin-top:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 18px;font-size:13px;line-height:1.5}
.band-trust svg{width:22px;height:22px;flex:none;color:var(--yellow)}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.road .rstep{padding:0 22px;position:relative}
.road .rstep:not(:last-child)::after{content:"";position:absolute;top:19px;right:-2px;width:calc(100% - 44px);left:calc(50% + 22px);height:2px;background:repeating-linear-gradient(90deg,var(--stroke-2) 0 6px,transparent 6px 12px)}
.road .rdot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;margin:0 auto 16px;position:relative;z-index:2}
.road .rstep h4{font-size:16px;font-weight:900;text-align:center}
.road .rstep p{font-size:12.5px;color:var(--muted);line-height:1.55;text-align:center;margin-top:7px}
.road .rstep .ph{display:block;text-align:center;font-size:11px;font-weight:800;color:var(--muted-2);margin-top:10px;text-transform:uppercase;letter-spacing:.05em}

/* final cta */
.cta-band{text-align:center;background:
  radial-gradient(500px 300px at 15% 0,rgba(247,201,72,.2),transparent 60%),
  radial-gradient(500px 300px at 100% 100%,rgba(244,100,63,.12),transparent 60%),
  var(--card);border:1px solid var(--stroke);border-radius:28px;padding:56px 30px;box-shadow:var(--sh-soft)}
.cta-band h2{font-size:34px;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
.cta-band p{font-size:15px;color:var(--muted);margin-top:12px;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.6}
.cta-band .hero-cta{justify-content:center}

/* footer */
.lfoot{border-top:1px solid var(--stroke);background:var(--bg-2);padding:30px 0}
.lfoot .in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lfoot .lbrand b{font-size:15px}
.lfoot small{font-size:12px;color:var(--muted-2)}
.lfoot .fl{display:flex;gap:18px}
.lfoot .fl a{font-size:12.5px;color:var(--muted);text-decoration:none;font-weight:600}
.lfoot .fl a:hover{color:var(--green-2)}

@media(max-width:1024px){
  .hero{grid-template-columns:1fr;gap:30px}
  .hv{height:340px}
  .fcards{grid-template-columns:repeat(2,1fr)}
  .dl-grid,.steps,.road{grid-template-columns:1fr}
  .road .rstep:not(:last-child)::after{display:none}
  .hero h1{font-size:40px}
  .lnav-links{display:none}
}
@media(max-width:560px){
  .fcards{grid-template-columns:1fr}
  .hero h1{font-size:32px}
  .sect-head h2,.cta-band h2{font-size:26px}
  .hero-stats{gap:18px}
}

/* ============ PRODUCT CHROME: palette · menus · skeletons ============ */
.tb-right .icon-btn,.tb-right .avatar,.tb-right .search{cursor:pointer}
.avatar{border:none;transition:.2s}
.avatar:hover{transform:translateY(-1px);box-shadow:var(--sh-lift)}
.icon-btn.on{background:var(--green-50);color:var(--green-2);border-color:var(--green-100)}

/* overlay + popovers */
.pop-scrim{position:fixed;inset:0;z-index:900;background:rgba(18,50,39,.14);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.16s}
.pop-scrim.show{opacity:1;pointer-events:auto}
.pop{position:fixed;z-index:950;background:var(--card);border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--sh-lift);opacity:0;transform:translateY(-6px) scale(.985);pointer-events:none;transition:.16s}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pop-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--stroke)}
.pop-head b{font-size:13.5px;font-weight:800}
.pop-head .link{font-size:11.5px;color:var(--green-2);font-weight:700;background:none;border:none}

/* notifications */
.notif-pop{top:64px;right:78px;width:360px;max-width:calc(100vw - 32px)}
.notif-list{max-height:400px;overflow-y:auto;padding:6px}
.nrow{display:flex;gap:11px;padding:11px;border-radius:12px;transition:.15s;cursor:pointer}
.nrow:hover{background:var(--bg-2)}
.nrow.unread{background:var(--green-50)}
.nrow .nic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center}
.nrow .ntx{flex:1;min-width:0}
.nrow .nt{font-size:12.8px;font-weight:700;color:var(--ink)}
.nrow .nd{font-size:11.8px;color:var(--muted);margin-top:2px;line-height:1.45}
.nrow .ntime{font-size:10.5px;color:var(--muted-2);font-weight:700;margin-top:4px}
.icon-btn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.icon-btn .dot.hide{display:none}

/* profile menu */
.menu-pop{top:64px;right:18px;width:250px;padding:7px}
.menu-id{display:flex;align-items:center;gap:11px;padding:10px 10px 12px;border-bottom:1px solid var(--stroke);margin-bottom:6px}
.menu-id .av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(140deg,var(--green),var(--yellow-2))}
.menu-id b{font-size:13.5px;display:block}
.menu-id small{font-size:11.5px;color:var(--muted)}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:11px;background:none;border:none;text-align:left;font-size:13px;font-weight:600;color:var(--ink-2);transition:.15s}
.menu-item:hover{background:var(--bg-2)}
.menu-item svg{width:17px;height:17px;color:var(--muted)}
.menu-item.danger{color:var(--rose)}
.menu-item.danger svg{color:var(--rose)}
.menu-sep{height:1px;background:var(--stroke);margin:6px 4px}

/* command palette */
.cmdk-scrim{position:fixed;inset:0;z-index:1000;background:rgba(18,50,39,.28);backdrop-filter:blur(4px);display:grid;place-items:start center;padding-top:12vh;opacity:0;pointer-events:none;transition:.16s}
.cmdk-scrim.show{opacity:1;pointer-events:auto}
.cmdk{width:600px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--stroke);border-radius:18px;box-shadow:0 30px 80px -20px rgba(18,50,39,.5);overflow:hidden;transform:translateY(-8px) scale(.98);transition:.18s}
.cmdk-scrim.show .cmdk{transform:none}
.cmdk-top{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--stroke)}
.cmdk-top svg{width:19px;height:19px;color:var(--muted)}
.cmdk-top input{flex:1;border:none;outline:none;font-size:16px;background:none;color:var(--ink);font-weight:500}
.cmdk-top kbd{font-size:11px;color:var(--muted);background:var(--bg-2);border:1px solid var(--stroke);border-radius:6px;padding:3px 7px}
.cmdk-list{max-height:52vh;overflow-y:auto;padding:8px}
.cmdk-group{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-2);font-weight:800;padding:10px 12px 5px}
.cmdk-item{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:12px;cursor:pointer;transition:.12s}
.cmdk-item .cic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--bg-2);color:var(--muted)}
.cmdk-item .ctx{flex:1;min-width:0}
.cmdk-item .ct{font-size:13.5px;font-weight:700;color:var(--ink)}
.cmdk-item .cd{font-size:11.5px;color:var(--muted);margin-top:1px}
.cmdk-item .carrow{font-size:11px;color:var(--muted-2);opacity:0;font-weight:800}
.cmdk-item.sel{background:var(--green-50)}
.cmdk-item.sel .cic{background:var(--green);color:#fff}
.cmdk-item.sel .carrow{opacity:1;color:var(--green-2)}
.cmdk-empty{padding:34px;text-align:center;color:var(--muted-2);font-size:13px;font-weight:600}
.cmdk-foot{display:flex;align-items:center;gap:16px;padding:10px 16px;border-top:1px solid var(--stroke);font-size:11px;color:var(--muted-2);font-weight:600}
.cmdk-foot kbd{font-family:'JetBrains Mono',monospace;background:var(--bg-2);border:1px solid var(--stroke);border-radius:5px;padding:1px 6px;margin-right:4px}

/* skeleton shimmer */
.skel{position:relative;overflow:hidden;background:#eef4ef;border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shim 1.3s infinite}
@keyframes shim{100%{transform:translateX(100%)}}
.skel-map{height:430px;border-radius:14px;display:grid;place-items:center;color:var(--muted-2);font-size:13px;font-weight:700}
.count-load{display:inline-block;width:44px;height:26px;vertical-align:middle}

/* settings */
.set-wrap{display:grid;grid-template-columns:220px 1fr;gap:18px}
.set-nav{display:flex;flex-direction:column;gap:3px}
.set-nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:none;border:none;text-align:left;font-size:13px;font-weight:700;color:var(--muted);transition:.15s}
.set-nav button:hover{background:var(--bg-2);color:var(--ink-2)}
.set-nav button.active{background:var(--green-50);color:var(--green-2)}
.set-nav button svg{width:17px;height:17px}
.set-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--stroke)}
.set-row:last-child{border-bottom:none}
.set-row .srt{flex:1}
.set-row .srt b{font-size:13.5px;font-weight:700;display:block}
.set-row .srt small{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.set-input{background:var(--bg-2);border:1px solid var(--stroke);border-radius:11px;padding:10px 13px;font-size:13.5px;color:var(--ink-2);outline:none;min-width:200px}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--stroke);border-radius:11px;padding:3px}
.seg button{border:none;background:none;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--green-2);box-shadow:var(--sh-soft)}
@media(max-width:820px){.set-wrap{grid-template-columns:1fr}.set-nav{flex-direction:row;overflow-x:auto}.notif-pop{right:12px}}
</style>
</head>
<body>
<div class="landing" id="landing"></div>
<div class="app hidden" id="dashboard">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-emblem"></div>
      <div><div class="brand-name">SafeSphere</div><div class="brand-sub">#the_Safest_Map</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <button class="sos-side" id="sosSide"><span class="rng"></span>Emergency SOS</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="tb-left">
        <div class="tb-mobile-logo"></div>
        <div><h1 class="page-title" id="pageTitle"></h1><div class="page-sub" id="pageSub"></div></div>
      </div>
      <div class="tb-right">
        <div class="search" id="tbSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg><input placeholder="Search or jump to…" readonly /><kbd class="mono">⌘K</kbd></div>
        <button class="icon-btn" id="bellBtn"><span class="dot" id="bellDot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <button class="avatar" id="avatarBtn">SV</button>
      </div>
    </header>
    <div class="view-tabs" id="viewTabs"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<!-- product chrome overlays -->
<div class="pop-scrim" id="popScrim"></div>
<div class="pop notif-pop" id="notifPop"></div>
<div class="pop menu-pop" id="menuPop"></div>
<div class="cmdk-scrim" id="cmdkScrim"></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
